name: Verifica build, tipi e test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Scarica il codice sorgente
      uses: actions/checkout@v4

    - name: Configura Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Installa le dipendenze
      run: npm install

    - name: Genera il client Prisma
      run: npx prisma generate

    - name: Test algoritmi, metriche e rotte
      run: npm test

    - name: Typecheck
      run: npx tsc --noEmit

    - name: Compilazione Next.js
      run: npm run build
